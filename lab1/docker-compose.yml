services:
  pg-master:
    build: .
    image: postgres-patroni:15
    container_name: pg-master
    hostname: pg-master
    restart: unless-stopped
    depends_on:
      - zoo
    ports:
      - "5433:5432"
    expose:
      - "8008"
    volumes:
      - pg-master-data:/var/lib/postgresql/data
    command: patroni /postgres0.yml

  pg-slave:
    build: .
    image: postgres-patroni:15
    container_name: pg-slave
    hostname: pg-slave
    restart: unless-stopped
    depends_on:
      - zoo
    ports:
      - "5434:5432"
    expose:
      - "8008"
    volumes:
      - pg-slave-data:/var/lib/postgresql/data
    command: patroni /postgres1.yml

  zoo:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zoo
    hostname: zoo
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  haproxy:
    image: haproxy:3.0
    container_name: postgres-entrypoint
    hostname: postgres-entrypoint
    restart: unless-stopped
    depends_on:
      - pg-master
      - pg-slave
      - zoo
    ports:
      - "5435:5432"
      - "7001:7000"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

volumes:
  pg-master-data:
  pg-slave-data: